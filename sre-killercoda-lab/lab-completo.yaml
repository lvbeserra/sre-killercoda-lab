# SRE KillerCoda Lab — estado declarativo conhecido em 07/11/2026
# Uso: kubectl apply -f lab-completo.yaml
# Imagens: busybox:1.36 e python:3.12-alpine
# Sem tokens, credenciais, kubeconfig, status, IPs de pods ou ClusterIP fixados.
apiVersion: v1
kind: Namespace
metadata:
  name: sre-release-lab
  labels:
    app.kubernetes.io/part-of: sre-killercoda-lab
---
apiVersion: v1
kind: Namespace
metadata:
  name: sre-cpu-lab
  labels:
    app.kubernetes.io/part-of: sre-killercoda-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  namespace: sre-release-lab
  labels:
    app.kubernetes.io/part-of: sre-killercoda-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-web
      track: blue
  template:
    metadata:
      labels:
        app: sre-web
        track: blue
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /www
              echo "versao=blue-v1" > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sre-web
  namespace: sre-release-lab
spec:
  type: ClusterIP
  selector:
    app: sre-web
    track: blue
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  namespace: sre-release-lab
  labels:
    app.kubernetes.io/part-of: sre-killercoda-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-web
      track: green
  template:
    metadata:
      labels:
        app: sre-web
        track: green
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /www
              echo "versao=green-v2" > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sre-web-green
  namespace: sre-release-lab
spec:
  type: ClusterIP
  selector:
    app: sre-web
    track: green
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: drain-app
  namespace: sre-release-lab
data:
  server.py: |
    import os
    import time
    import signal
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/ready":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"READY\n")
                return
            if self.path == "/slow":
                print("REQUEST_START", time.time(), flush=True)
                time.sleep(12)
                self.send_response(200)
                self.end_headers()
                self.wfile.write(f"COMPLETED pod={os.getenv('HOSTNAME')}\n".encode())
                print("REQUEST_END", time.time(), flush=True)
                return
            self.send_error(404)

    class Server(ThreadingHTTPServer):
        daemon_threads = False

    server = Server(("0.0.0.0", 8080), Handler)

    def terminate(sig, frame):
        print("SIGTERM_RECEIVED", time.time(), flush=True)
        threading.Thread(target=server.shutdown, daemon=True).start()

    signal.signal(signal.SIGTERM, terminate)
    print("SERVER_READY", flush=True)
    server.serve_forever()
    server.server_close()
    print("GRACEFUL_EXIT", flush=True)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drain-demo
  namespace: sre-release-lab
  labels:
    app.kubernetes.io/part-of: sre-killercoda-lab
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: drain-demo
  template:
    metadata:
      labels:
        app: drain-demo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: app
          configMap:
            name: drain-app
---
apiVersion: v1
kind: Service
metadata:
  name: drain-demo
  namespace: sre-release-lab
spec:
  type: ClusterIP
  selector:
    app: drain-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
