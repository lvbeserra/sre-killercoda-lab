# Opcional: JOBs CPU-bound; nao sao restaurados automaticamente.
# Executar um por vez para teste comparavel em 1 vCPU.
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-100m
  namespace: sre-cpu-lab
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: benchmark
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              start=$(date +%s)
              dd if=/dev/zero bs=1M count=128 2>/dev/null | sha256sum
              end=$(date +%s)
              echo "duracao_segundos=$((end-start))"
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
