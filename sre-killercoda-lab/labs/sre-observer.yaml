apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sre-observer-data
  namespace: sre-middleware-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-observer
  namespace: sre-middleware-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sre-observer
  template:
    metadata:
      labels:
        app: sre-observer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: observer
          image: python:3.12-slim
          command: ["python", "-u", "/app/collector.py", "run"]
          env:
            - name: SRE_OBSERVER_DB
              value: /data/observations.sqlite3
            - name: SRE_OBSERVER_INTERVAL_SECONDS
              value: "30"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: source
          configMap:
            name: sre-observer-code
        - name: data
          persistentVolumeClaim:
            claimName: sre-observer-data
