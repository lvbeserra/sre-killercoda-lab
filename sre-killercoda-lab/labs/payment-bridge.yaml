# API bridge Kafka -> RabbitMQ: laboratório somente (pagamentos fictícios).
# Sem TLS, sem persistência de filas, sem processamento financeiro real.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-bridge
  namespace: sre-middleware-lab
  labels:
    app.kubernetes.io/name: payment-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment-bridge
  template:
    metadata:
      labels:
        app: payment-bridge
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: bridge
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              pip install --disable-pip-version-check --no-cache-dir -r /app/requirements.txt
              exec python -u /app/bridge.py
          env:
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
            - {name: KAFKA_TOPIC, value: "pagamentos-simulados"}
            - {name: RABBIT_HOST, value: "rabbitmq"}
            - {name: RABBIT_QUEUE, value: "notificacoes-pagamentos"}
            - {name: RABBIT_USER, value: labuser}
            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: password
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: payment-bridge-code
