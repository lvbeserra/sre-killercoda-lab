# Apache HTTP Server como proxy reverso. Exclusivo do lab.
# O ProxyRequests Off evita criar um proxy de navegacao aberto.
ServerName localhost
ProxyRequests Off
ProxyPreserveHost On

ProxyPass        "/tomcat/"  "http://tomcat-app:8080/" connectiontimeout=5 timeout=15
ProxyPassReverse "/tomcat/"  "http://tomcat-app:8080/"

# Sem WildFly instalado, /wildfly/ responde 503 (comportamento esperado).
ProxyPass        "/wildfly/" "http://wildfly-app:8080/" connectiontimeout=5 timeout=30
ProxyPassReverse "/wildfly/" "http://wildfly-app:8080/"
