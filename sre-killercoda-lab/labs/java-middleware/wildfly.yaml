# WildFly 40.0.1 EE10/JDK21 sobre UBI9: laboratorio para CPU sem x86-64-v3.
# WildFly 41+ (UBI10) exige x86-64-v3; este tag FIXO e legado para compatibilidade.
# Nao substituir JBoss EAP corporativo por este laboratorio em producao.
apiVersion: v1
kind: Service
metadata:
  name: wildfly-app
  namespace: sre-java-lab
spec:
  type: ClusterIP
  selector:
    app: wildfly-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildfly-app
  namespace: sre-java-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wildfly-app
  template:
    metadata:
      labels:
        app: wildfly-app
    spec:
      automountServiceAccountToken: false
      # Preferir worker e evitar carga extra no plano de controle.
      # Preferencia suave: permite laboratorios de no unico no VirtualBox.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: prepare-exploded-war
          image: busybox:1.36
          command: ["sh", "-ec"]
          args:
            - |
              mkdir -p /deployments/ROOT.war
              cp /config/index.jsp /deployments/ROOT.war/index.jsp
              touch /deployments/ROOT.war.dodeploy
              # A imagem WildFly executa como UID/GID 1000.
              chown -R 1000:1000 /deployments
          volumeMounts:
            - name: deployments
              mountPath: /deployments
            - name: jsp
              mountPath: /config
              readOnly: true
      containers:
        - name: wildfly
          image: quay.io/wildfly/wildfly-ee-10:40.0.1.Final-jdk21
          imagePullPolicy: IfNotPresent
          # Perfil de LAB: memoria limitada ao testar uma pagina JSP simples.
          # Não é dimensionamento de produção. Reavaliar se houver OOMKilled.
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=192m -Djava.awt.headless=true"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /index.jsp
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 72
          readinessProbe:
            httpGet:
              path: /index.jsp
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.jsp
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 640Mi
          volumeMounts:
            - name: deployments
              mountPath: /opt/jboss/wildfly/standalone/deployments
      volumes:
        - name: jsp
          configMap:
            name: java-lab-jsp
        - name: deployments
          emptyDir: {}
