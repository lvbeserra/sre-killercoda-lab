# Apache HTTP Server 2.4 -> Tomcat 10.1. Rodar somente em namespace lab.
# ConfigMaps java-lab-jsp e java-lab-apache-conf sao criados pelo restore-java.sh.
apiVersion: v1
kind: Service
metadata:
  name: tomcat-app
  namespace: sre-java-lab
spec:
  type: ClusterIP
  selector:
    app: tomcat-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-app
  namespace: sre-java-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tomcat-app
  template:
    metadata:
      labels:
        app: tomcat-app
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-jsp
          image: busybox:1.36
          command: ["sh", "-ec"]
          args:
            - |
              mkdir -p /webapps/ROOT
              cp /config/index.jsp /webapps/ROOT/index.jsp
          volumeMounts:
            - name: webapps
              mountPath: /webapps
            - name: jsp
              mountPath: /config
              readOnly: true
      containers:
        - name: tomcat
          image: tomcat:10.1-jdk17-temurin
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0 -Djava.awt.headless=true"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /index.jsp
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 50
          readinessProbe:
            httpGet:
              path: /index.jsp
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.jsp
              port: http
            periodSeconds: 25
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 700m
              memory: 512Mi
          volumeMounts:
            - name: webapps
              mountPath: /usr/local/tomcat/webapps
      volumes:
        - name: jsp
          configMap:
            name: java-lab-jsp
        - name: webapps
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apache-gateway
  namespace: sre-java-lab
spec:
  type: ClusterIP
  selector:
    app: apache-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-gateway
  namespace: sre-java-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-gateway
  template:
    metadata:
      labels:
        app: apache-gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: httpd
          image: httpd:2.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - |
              cp /usr/local/apache2/conf/httpd.conf /tmp/httpd.conf
              sed -i \
                -e 's/^#LoadModule proxy_module/LoadModule proxy_module/' \
                -e 's/^#LoadModule proxy_http_module/LoadModule proxy_http_module/' \
                /tmp/httpd.conf
              printf '\nInclude conf/extra/sre-proxy.conf\n' >> /tmp/httpd.conf
              httpd -t -f /tmp/httpd.conf
              exec httpd -f /tmp/httpd.conf -DFOREGROUND
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 25
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: apache-extra
              mountPath: /usr/local/apache2/conf/extra/sre-proxy.conf
              subPath: apache-proxy.conf
              readOnly: true
      volumes:
        - name: apache-extra
          configMap:
            name: java-lab-apache-conf
